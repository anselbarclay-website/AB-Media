backend:
  name: github
  repo: anselbarclay-website/AB-Media
  branch: main
publish_mode: editorial_workflow
media_folder: images/uploads
public_folder: /images/uploads
collections:
- name: site
  label: AB Media Website
  files:
  - name: content
    label: Website Content
    file: content/site.json
    format: json
    fields:
    - label: Website Appearance
      name: appearance
      widget: object
      fields:
      - label: Theme
        name: theme
        widget: select
        options:
        - label: Dark — black background / white text
          value: dark
        - label: Light — white background / black text
          value: light
        default: dark
    - label: Homepage
      name: hero
      widget: object
      fields:
      - label: Main Title
        name: headline
        widget: string
      - label: Tagline
        name: tagline
        widget: text
      - label: Highlight Reel
        name: highlight_reel
        widget: file
        required: false
        media_folder: /videos
        public_folder: /videos
    - label: Homepage Cover Images
      name: covers
      widget: object
      fields:
      - label: Category 1 Cover
        name: fashion
        widget: image
        required: false
      - label: Category 2 Cover
        name: property
        widget: image
        required: false
      - label: Category 3 Cover
        name: music
        widget: image
        required: false
      - label: Category 4 Cover
        name: commercial
        widget: image
        required: false
    - label: Homepage Originals Section
      name: originals_home
      widget: object
      fields:
      - label: Show section
        name: enabled
        widget: boolean
        default: true
      - label: Heading
        name: heading
        widget: string
      - label: Description
        name: description
        widget: text
      - label: Featured film title
        name: featured_title
        widget: string
        required: false
      - label: YouTube or Vimeo URL
        name: youtube_url
        widget: string
      - label: Explore button text
        name: button_text
        widget: string
    - label: Contact
      name: contact
      widget: object
      fields:
      - label: Email
        name: email
        widget: string
      - label: Instagram URL or @handle
        name: instagram
        widget: string
        required: false
      - label: Headshot
        name: headshot
        widget: image
        required: false
      - label: Bio
        name: bio
        widget: text
        required: false
      - label: Contact Button Text
        name: cta
        widget: string
        required: false
        default: Start a Project
    - label: Category Titles, Captions & Subcategories
      name: category_settings
      widget: object
      fields:
      - label: Fashion Settings
        name: fashion
        widget: object
        fields:
        - label: Category Title
          name: title
          widget: string
        - label: Category Caption
          name: caption
          widget: text
        - label: Subcategories
          name: subcategories
          widget: list
          min: 1
          max: 8
          summary: '{{fields.title}}'
          fields:
          - label: Subcategory ID
            name: id
            widget: select
            options:
            - sub1
            - sub2
            - sub3
            - sub4
            - sub5
            - sub6
            - sub7
            - sub8
          - label: Subcategory Title
            name: title
            widget: string
      - label: Property Settings
        name: property
        widget: object
        fields:
        - label: Category Title
          name: title
          widget: string
        - label: Category Caption
          name: caption
          widget: text
        - label: Subcategories
          name: subcategories
          widget: list
          min: 1
          max: 8
          summary: '{{fields.title}}'
          fields:
          - label: Subcategory ID
            name: id
            widget: select
            options:
            - sub1
            - sub2
            - sub3
            - sub4
            - sub5
            - sub6
            - sub7
            - sub8
          - label: Subcategory Title
            name: title
            widget: string
      - label: Music Settings
        name: music
        widget: object
        fields:
        - label: Category Title
          name: title
          widget: string
        - label: Category Caption
          name: caption
          widget: text
        - label: Subcategories
          name: subcategories
          widget: list
          min: 1
          max: 8
          summary: '{{fields.title}}'
          fields:
          - label: Subcategory ID
            name: id
            widget: select
            options:
            - sub1
            - sub2
            - sub3
            - sub4
            - sub5
            - sub6
            - sub7
            - sub8
          - label: Subcategory Title
            name: title
            widget: string
      - label: Commercial Settings
        name: commercial
        widget: object
        fields:
        - label: Category Title
          name: title
          widget: string
        - label: Category Caption
          name: caption
          widget: text
        - label: Subcategories
          name: subcategories
          widget: list
          min: 1
          max: 8
          summary: '{{fields.title}}'
          fields:
          - label: Subcategory ID
            name: id
            widget: select
            options:
            - sub1
            - sub2
            - sub3
            - sub4
            - sub5
            - sub6
            - sub7
            - sub8
          - label: Subcategory Title
            name: title
            widget: string
    - label: Fashion Gallery
      name: fashion
      widget: list
      summary: '{{fields.caption}}'
      fields:
      - label: Subcategory
        name: subcategory
        widget: select
        options:
        - sub1
        - sub2
        - sub3
        - sub4
        - sub5
        - sub6
        - sub7
        - sub8
        default: sub1
        hint: Changing this moves the existing item without re-uploading its image.
      - label: Type
        name: type
        widget: select
        options:
        - Photo
        - Video
        default: Photo
      - label: Image
        name: image
        widget: image
        required: false
      - label: Video File (small MP4/WebM)
        name: video_file
        widget: file
        required: false
        media_folder: /videos
        public_folder: /videos
      - label: Video URL (YouTube, Vimeo, or direct video URL)
        name: video_url
        widget: string
        required: false
      - label: Caption
        name: caption
        widget: string
        required: false
    - label: Property Gallery
      name: property
      widget: list
      summary: '{{fields.caption}}'
      fields:
      - label: Subcategory
        name: subcategory
        widget: select
        options:
        - sub1
        - sub2
        - sub3
        - sub4
        - sub5
        - sub6
        - sub7
        - sub8
        default: sub1
        hint: Changing this moves the existing item without re-uploading its image.
      - label: Type
        name: type
        widget: select
        options:
        - Photo
        - Video
        default: Photo
      - label: Image
        name: image
        widget: image
        required: false
      - label: Video File (small MP4/WebM)
        name: video_file
        widget: file
        required: false
        media_folder: /videos
        public_folder: /videos
      - label: Video URL (YouTube, Vimeo, or direct video URL)
        name: video_url
        widget: string
        required: false
      - label: Caption
        name: caption
        widget: string
        required: false
    - label: Music Gallery
      name: music
      widget: list
      summary: '{{fields.caption}}'
      fields:
      - label: Subcategory
        name: subcategory
        widget: select
        options:
        - sub1
        - sub2
        - sub3
        - sub4
        - sub5
        - sub6
        - sub7
        - sub8
        default: sub1
        hint: Changing this moves the existing item without re-uploading its image.
      - label: Type
        name: type
        widget: select
        options:
        - Photo
        - Video
        default: Photo
      - label: Image
        name: image
        widget: image
        required: false
      - label: Video File (small MP4/WebM)
        name: video_file
        widget: file
        required: false
        media_folder: /videos
        public_folder: /videos
      - label: Video URL (YouTube, Vimeo, or direct video URL)
        name: video_url
        widget: string
        required: false
      - label: Caption
        name: caption
        widget: string
        required: false
    - label: Commercial Gallery
      name: commercial
      widget: list
      summary: '{{fields.caption}}'
      fields:
      - label: Subcategory
        name: subcategory
        widget: select
        options:
        - sub1
        - sub2
        - sub3
        - sub4
        - sub5
        - sub6
        - sub7
        - sub8
        default: sub1
        hint: Changing this moves the existing item without re-uploading its image.
      - label: Type
        name: type
        widget: select
        options:
        - Photo
        - Video
        default: Photo
      - label: Image
        name: image
        widget: image
        required: false
      - label: Video File (small MP4/WebM)
        name: video_file
        widget: file
        required: false
        media_folder: /videos
        public_folder: /videos
      - label: Video URL (YouTube, Vimeo, or direct video URL)
        name: video_url
        widget: string
        required: false
      - label: Caption
        name: caption
        widget: string
        required: false
- name: originals_settings
  label: Originals — Page Settings
  files:
  - name: settings
    label: Page Headings
    file: content/originals-settings.json
    format: json
    fields:
    - label: Page heading
      name: heading
      widget: string
    - label: Introduction
      name: introduction
      widget: text
    - label: Project section heading
      name: working_on_heading
      widget: string
    - label: Updates heading
      name: updates_heading
      widget: string
- name: original_films
  label: Original Films
  folder: content/originals
  create: true
  delete: true
  slug: '{{slug}}'
  extension: json
  format: json
  identifier_field: title
  summary: '{{title}} — {{status}}'
  fields:
  - label: Film title
    name: title
    widget: string
  - label: URL slug
    name: slug
    widget: string
    hint: Short unique name (e.g. trance)
  - label: Visible on Originals page
    name: visible
    widget: boolean
    default: true
  - label: Status
    name: status
    widget: select
    options:
    - In Development
    - Coming Soon
    - Released
    default: In Development
  - label: Year / season
    name: year
    widget: string
    required: false
  - label: Cover image
    name: cover_image
    widget: image
    required: false
  - label: Synopsis
    name: synopsis
    widget: text
    required: false
  - label: Film video URL
    name: video_url
    widget: string
    required: false
  - label: Additional images
    name: gallery
    widget: list
    required: false
    field:
      label: Image
      name: image
      widget: image
  - label: Production Updates
    name: updates
    widget: list
    required: false
    summary: '{{fields.title}}'
    fields:
    - label: Title
      name: title
      widget: string
    - label: Date
      name: date
      widget: datetime
      date_format: YYYY-MM-DD
      time_format: false
      format: YYYY-MM-DD
    - label: Description
      name: description
      widget: text
    - label: Image
      name: image
      widget: image
      required: false
    - label: Show update
      name: visible
      widget: boolean
      default: true
