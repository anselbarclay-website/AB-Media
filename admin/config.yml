                      - { label: "Subcategory Title", name: "title", widget: "string" }
                  - label: "Gallery Items"
                    name: "items"
                    widget: "list"
                    summary: "{{fields.caption}}"
                    fields:
                      - { label: "Subcategory", name: "subcategory", widget: "select", options: ["sub1", "sub2", "sub3", "sub4", "sub5", "sub6", "sub7", "sub8"], default: "sub1", hint: "Choose the ID matching the subcategory above. Changing this does not re-upload the image." }
                      - { label: "Type", name: "type", widget: "select", options: ["Photo", "Video"], default: "Photo" }
                      - { label: "Image", name: "image", widget: "image", required: false }
                      - { label: "Video File (small MP4/WebM)", name: "video_file", widget: "file", required: false, media_folder: "/videos", public_folder: "/videos" }
                      - { label: "Video URL (YouTube, Vimeo, or direct video URL)", name: "video_url", widget: "string", required: false }
                      - { label: "Caption", name: "caption", widget: "string", required: false }
              - label: "Category 4"
